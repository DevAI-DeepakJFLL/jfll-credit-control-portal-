name: Deploy JFLL Credit Portal to AWS Free Tier

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: aws-deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # =========================================================================
  # JOB 1: Automated Unit Tests, Build Gates & Security Audit
  # =========================================================================
  audit-and-test:
    name: Unit Tests & Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Zero Hardcoded Secrets & Clean Repository Storage
        run: |
          echo "=== Scanning for tracked SQLite DBs or sensitive environment files ==="
          if git ls-files backend/storage | grep -E '\.(db|db-wal|db-shm)$'; then
            echo "::error::Detected committed database files in backend/storage!"
            exit 1
          fi
          if git ls-files | grep -E '^\.env($|\.local|\.production|\.development|\.secret)'; then
            echo "::error::Detected committed .env file!"
            exit 1
          fi
          echo "✅ Security verification passed: Zero credentials or sensitive database files tracked."

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt httpx

      - name: Run Backend Unit Test Suite (38/38)
        run: |
          python -m unittest discover backend/tests -v

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run TypeScript Verification & Production Build
        working-directory: ./frontend
        run: |
          npx tsc --noEmit
          npm run build

  # =========================================================================
  # JOB 2: Deploy to AWS Free Tier (S3 + CloudFront + Lambda Function URL)
  # =========================================================================
  deploy-aws:
    name: Package & Deploy to AWS Free Tier
    needs: [ audit-and-test ]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify AWS Credentials & Secret Configuration
        id: check-creds
        env:
          AWS_KEY: ${{ secrets.AWS_ACCESS_KEY_ID || vars.AWS_ACCESS_KEY_ID }}
          AWS_SEC: ${{ secrets.AWS_SECRET_ACCESS_KEY || vars.AWS_SECRET_ACCESS_KEY }}
        run: |
          if [ -z "$AWS_KEY" ] || [ -z "$AWS_SEC" ]; then
            echo "::warning::AWS credentials not found in GitHub Secrets! Deployment step skipped."
            echo "👉 To enable automated deployment, add AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY to GitHub Secrets."
            echo "has_creds=false" >> $GITHUB_OUTPUT
          else
            echo "✅ AWS credentials present in GitHub Secrets."
            echo "has_creds=true" >> $GITHUB_OUTPUT
          fi

      - name: Set up Python 3.12
        if: steps.check-creds.outputs.has_creds == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configure AWS Credentials
        if: steps.check-creds.outputs.has_creds == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID || vars.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY || vars.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'ap-southeast-2' }}

      # -----------------------------------------------------------------------
      # BACKEND: Package & Update AWS Lambda Function
      # -----------------------------------------------------------------------
      - name: Build Stripped Serverless Lambda Package
        if: steps.check-creds.outputs.has_creds == 'true'
        run: |
          echo "Packaging FastAPI Mangum backend for AWS Lambda..."
          mkdir -p build_package
          
          # Install stripped production dependencies
          pip install --no-cache-dir --target=build_package -r backend/requirements-lambda.txt
          
          # Clean non-runtime assets to keep bundle ultra-compact
          find build_package -type d -name "tests" -exec rm -rf {} + 2>/dev/null || true
          find build_package -type d -name "test" -exec rm -rf {} + 2>/dev/null || true
          find build_package -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
          find build_package -name "*.pyc" -delete 2>/dev/null || true
          find build_package -name "*.dist-info" -exec rm -rf {} + 2>/dev/null || true
          
          # Copy application modules and entrypoint
          mkdir -p build_package/backend
          cp -r backend/app build_package/backend/
          cp backend/__init__.py build_package/backend/ 2>/dev/null || true
          cp lambda_handler.py build_package/
          cp lambda_function.py build_package/
          cp jfll-logo.jpeg build_package/
          
          # Remove local bytecode from application code
          find build_package/backend -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
          
          # Zip package
          cd build_package
          zip -9 -q -r ../lambda_artifact.zip .
          cd ..
          echo "Lambda Package Size:"
          ls -lh lambda_artifact.zip

      - name: Deploy Backend to AWS Lambda
        if: steps.check-creds.outputs.has_creds == 'true'
        env:
          LAMBDA_NAME: ${{ vars.LAMBDA_FUNCTION_NAME || secrets.LAMBDA_FUNCTION_NAME || vars.AWS_LAMBDA_FUNCTION_NAME || secrets.AWS_LAMBDA_FUNCTION_NAME || 'jfll-credit-portal-api' }}
          RAW_DATA_BUCKET: ${{ vars.S3_DATA_BUCKET || secrets.S3_DATA_BUCKET || vars.S3_BUCKET_NAME || secrets.S3_BUCKET_NAME }}
          AWS_REGION: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'ap-southeast-2' }}
        run: |
          DATA_BUCKET=$(echo "$RAW_DATA_BUCKET" | sed 's|^s3://||' | tr -d ' ')
          echo "Checking if Lambda function '$LAMBDA_NAME' exists in $AWS_REGION..."
          if aws lambda get-function --function-name "$LAMBDA_NAME" --region "$AWS_REGION" 2>/dev/null; then
            echo "Updating Lambda function code for $LAMBDA_NAME..."
            
            # If S3 Data Bucket is configured and accessible, upload via S3 to bypass direct zip size limits
            UPLOADED_VIA_S3=false
            if [ -n "$DATA_BUCKET" ]; then
              echo "Attempting upload to s3://$DATA_BUCKET/builds/lambda_artifact.zip..."
              if aws s3 cp lambda_artifact.zip "s3://${DATA_BUCKET}/builds/lambda_artifact.zip" --region "$AWS_REGION" 2>/dev/null; then
                aws lambda update-function-code \
                  --function-name "$LAMBDA_NAME" \
                  --s3-bucket "$DATA_BUCKET" \
                  --s3-key "builds/lambda_artifact.zip" \
                  --region "$AWS_REGION"
                UPLOADED_VIA_S3=true
              else
                echo "Notice: Could not upload to S3 bucket '$DATA_BUCKET' (bucket might not exist yet). Falling back to direct zip upload..."
              fi
            fi
            
            if [ "$UPLOADED_VIA_S3" = "false" ]; then
              aws lambda update-function-code \
                --function-name "$LAMBDA_NAME" \
                --zip-file fileb://lambda_artifact.zip \
                --region "$AWS_REGION"
            fi
            
            echo "Waiting for Lambda function update to complete..."
            aws lambda wait function-updated --function-name "$LAMBDA_NAME" --region "$AWS_REGION"
            
            # Sync handler and runtime settings if permissions permit
            aws lambda update-function-configuration \
              --function-name "$LAMBDA_NAME" \
              --handler "lambda_handler.handler" \
              --timeout 30 \
              --memory-size 512 \
              --region "$AWS_REGION" 2>/dev/null || true
            
            # Configure Function URL CORS at the infrastructure layer (restricted to CloudFront and local dev)
            aws lambda update-function-url-config \
              --function-name "$LAMBDA_NAME" \
              --cors 'AllowOrigins=["https://d1whr25asi79gg.cloudfront.net","http://localhost:3000","http://127.0.0.1:3000"],AllowMethods=["GET","POST","OPTIONS"],AllowHeaders=["*"],MaxAge=86400' \
              --region "$AWS_REGION" 2>/dev/null || echo "Notice: Function URL CORS update deferred to AWS Console."
            
            echo "✅ Lambda function '$LAMBDA_NAME' successfully deployed!"
          else
            echo "::warning::Lambda function '$LAMBDA_NAME' does not exist yet. Please create it once using the AWS Console or Setup Guide."
          fi

      # -----------------------------------------------------------------------
      # FRONTEND: Build & Sync React SPA to S3 + Invalidate CloudFront
      # -----------------------------------------------------------------------
      - name: Set up Node.js 20 for Frontend Build
        if: steps.check-creds.outputs.has_creds == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Frontend SPA
        if: steps.check-creds.outputs.has_creds == 'true'
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || secrets.VITE_API_BASE_URL || vars.NEXT_PUBLIC_API_URL }}
        working-directory: ./frontend
        run: |
          npm ci
          npm run build

      - name: Sync Frontend Build to S3 Bucket
        if: steps.check-creds.outputs.has_creds == 'true'
        env:
          RAW_FE_BUCKET: ${{ vars.S3_FRONTEND_BUCKET || secrets.S3_FRONTEND_BUCKET || vars.AWS_S3_BUCKET_NAME || secrets.AWS_S3_BUCKET_NAME }}
          AWS_REGION: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'ap-southeast-2' }}
        run: |
          FE_BUCKET=$(echo "$RAW_FE_BUCKET" | sed 's|^s3://||' | tr -d ' ')
          if [ -n "$FE_BUCKET" ]; then
            echo "Target S3 Bucket: $FE_BUCKET in region $AWS_REGION"
            
            # Verify if bucket exists
            if ! aws s3 ls "s3://${FE_BUCKET}" --region "$AWS_REGION" > /dev/null 2>&1; then
              echo "::error::Cannot list objects in s3://${FE_BUCKET} in region $AWS_REGION!"
              echo "👉 Please verify that:"
              echo "   1. The bucket '$FE_BUCKET' was created in AWS S3."
              echo "   2. The bucket is located in region '$AWS_REGION'."
              echo "   3. Your IAM credentials have 's3:ListBucket' and 's3:PutObject' permissions for this bucket."
              exit 1
            fi
            
            echo "Syncing frontend assets to s3://${FE_BUCKET}..."
            
            # Sync immutable hashed JS/CSS assets (1 year cache)
            aws s3 sync frontend/dist "s3://${FE_BUCKET}" \
              --delete \
              --exclude "*.html" \
              --cache-control "public, max-age=31536000, immutable" \
              --region "$AWS_REGION"
              
            # Sync HTML and root documents with no-cache so updates are immediately visible
            aws s3 sync frontend/dist "s3://${FE_BUCKET}" \
              --delete \
              --include "*.html" \
              --cache-control "no-cache, no-store, must-revalidate" \
              --region "$AWS_REGION"
              
            echo "✅ Frontend successfully synced to S3!"
          else
            echo "::warning::S3_FRONTEND_BUCKET not configured in GitHub Secrets/Variables. Skipping S3 static sync."
          fi

      - name: Invalidate CloudFront CDN Cache
        if: steps.check-creds.outputs.has_creds == 'true'
        env:
          RAW_DIST_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID || secrets.CLOUDFRONT_DISTRIBUTION_ID || vars.AWS_CLOUDFRONT_DISTRIBUTION_ID || secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          DIST_ID=$(echo "$RAW_DIST_ID" | tr -d ' ')
          if [ -n "$DIST_ID" ]; then
            echo "Invalidating CloudFront cache for distribution $DIST_ID..."
            aws cloudfront create-invalidation \
              --distribution-id "$DIST_ID" \
              --paths "/*"
            echo "✅ CloudFront cache invalidation submitted."
          else
            echo "Notice: CLOUDFRONT_DISTRIBUTION_ID not configured. Skipping CDN invalidation."
          fi
