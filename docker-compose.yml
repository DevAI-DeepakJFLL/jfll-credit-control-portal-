services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: jfll-credit-backend
    restart: unless-stopped
    environment:
      - ALLOWED_ORIGINS=*
      - STORAGE_DIR=/app/backend/storage
    volumes:
      - storage_data:/app/backend/storage
    ports:
      - "8001:8001"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: jfll-credit-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  storage_data:
    driver: local
